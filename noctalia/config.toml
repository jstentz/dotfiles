[shell]
polkit_agent = true
setup_wizard_enabled = false

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4"]

[wallpaper.default]
path = "~/.config/hypr/wallpaper.jpeg"
